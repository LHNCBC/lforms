
<div *ngIf="item" >
  <nz-radio-group
    [ngModel]="radioValue"
    (ngModelChange)="onRadioModelChange($event)"
    [nzDisabled]="item._readOnly"
    [nzName]="'radiogroup_' + item._elementId"
    attr.aria-labelledby="label-{{ item._elementId }}"
    role="radiogroup"
    nz-row
    class="lhc-radio-group"
    [lhcAnswerOptionMinWidth]="commonUtils.getDisplayControlEffectiveColumnCount(item.displayControl, acOptions.listItems.length + (item.answerConstraint === 'optionsOrString' ? 1 : 0))"
    [style.--lhc-answer-column-width]="commonUtils.getDisplayControlColumnWidth(item.displayControl, acOptions.listItems.length + (item.answerConstraint === 'optionsOrString' ? 1 : 0))"
    [ngClass]="{
      'lhc-vertical': commonUtils.getDisplayControlIsVertical(item.displayControl),
      'lhc-grid': commonUtils.getDisplayControlIsGrid(item.displayControl)
    }">
    <label
      *ngFor="let answer of acOptions.listItems; index as i"
      class="lhc-answer"
      nz-radio
      [nzDisabled]="item._readOnly"
      [disabled]="item._readOnly"
      (click)="lhcDataService.setActiveRow(item)"
      [nzValue]="item.answers[i]"
      [(ngModel)]="radioModels[i]"
      [id]="lhcDataService.getItemAnswerId(item, answer)"
      [style]="answer._obj_CSS"
      [style.grid-row]="commonUtils.getAnswerLayoutGridRow(i, acOptions.listItems.length + (item.answerConstraint === 'optionsOrString' ? 1 : 0), item.displayControl)"
      [style.grid-column]="commonUtils.getAnswerLayoutGridColumn(i, acOptions.listItems.length + (item.answerConstraint === 'optionsOrString' ? 1 : 0), item.displayControl)">
      <ng-container [ngSwitch]="lhcDataService.getTextDisplayType(answer)">
        <ng-container *ngSwitchCase="'escaped'">{{answer._displayTextHTML}}</ng-container>
        <span *ngSwitchCase="'html'" [outerHTML]="answer._displayTextHTML | safeHtml"></span>
        <span *ngSwitchCase="'markdown'" [outerHTML]="answer._displayTextMarkdown | safeHtml"></span>
        <ng-container *ngSwitchCase="'plain'">{{answer._displayText}}</ng-container>
      </ng-container>
    </label>

    <label
      *ngIf="item.answerConstraint === 'optionsOrString'"
      nz-radio
      [nzDisabled]="item._readOnly"
      [disabled]="item._readOnly"
      (click)="lhcDataService.setActiveRow(item)"
      [nzValue]="{'text': otherValue, '_notOnList': true}"
      [(ngModel)]="otherRadioModel"
      [id]="lhcDataService.getItemAnswerId(item, '_other')"
      class="lhc-answer"
      [style.grid-row]="commonUtils.getAnswerLayoutGridRow(acOptions.listItems.length, acOptions.listItems.length + 1, item.displayControl)"
      [style.grid-column]="commonUtils.getAnswerLayoutGridColumn(acOptions.listItems.length, acOptions.listItems.length + 1, item.displayControl)">
      {{item.openLabel || language.other}}
      <input
        type="text"
        [ngModel]="otherValue"
        (ngModelChange)="onOtherValueChange($event)"
        class="lhc-answer-other-input"
        [id]="lhcDataService.getItemAnswerId(item, '_otherValue')"
        nz-input
        [disabled]="item._readOnly"
        *ngIf="radioValue && radioValue._notOnList"
        (focus)="lhcDataService.setActiveRow(item)"/>
    </label>
  </nz-radio-group>

  <button type="button"
    *ngIf="lhcDataService.getLhcFormData()?.templateOptions.showRadioClearSelectionButton"
    [id]="lhcDataService.getItemAnswerId(item, '_clearSelection')"
    class="lhc-float-button lhc-button"
    [disabled]="item._readOnly"
    (click)="onRadioModelChange(undefined)">
    {{language.clearSelection}}
  </button>
</div>
