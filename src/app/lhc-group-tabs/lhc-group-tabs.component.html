<ng-container *ngIf="item && item.items">
  <div *ngIf="lhcDataService.getShowTabContainerText() && item._text"
       class="lhc-item-group-title lhc-tab-container-text">
    <lhc-item-question-text [item]="item"></lhc-item-question-text>
  </div>
  <!-- Inherit the complete parent layout until the first usable width measurement. -->
  <nz-tabset #tabset nzType="card" [nzTabPosition]="lhcDataService.getTabPosition()"
             [class.lhc-tab-content-indented]="!lhcDataService.getTemplateOptions().hideIndentation"
             [class.lhc-tabs-sticky]="lhcDataService.getStickyTabs()"
             [style.--lhc-tab-question-direction]="contentAnswerWidth === null ? null : stackQuestions ? 'column' : 'row'"
             [style.--lhc-tab-question-label-width]="contentAnswerWidth === null ? null : stackQuestions ? '100%' : 'auto'"
             [style.--lhc-tab-content-answer-width]="contentAnswerWidth === null ? null : stackQuestions ? '100%' : lhcDataService.getTabPosition() === 'left' &&
               lhcDataService.getTabAnswerAlignment() === 'content' ? contentAnswerWidth : null"
             (nzSelectedIndexChange)="onSelectedIndexChange($event)">
    <ng-container *ngFor="let group of item.items">
      <ng-container *ngIf="!group._isHiddenFromView">
        <nz-tab [nzTitle]="group._text">
          <lhc-group-vertical [item]="group"
                              [isTabContent]="true"
                              [hideGrouptTitle]="!lhcDataService.getShowTabHeader()"></lhc-group-vertical>
        </nz-tab>
      </ng-container>
    </ng-container>
  </nz-tabset>
</ng-container>
